name: AskMemoUS
schemes:
  AskMemoUS:
    build:
      targets:
        AskMemoUS: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
options:
  bundleIdPrefix: com.memous
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  HybridAskCore:
    path: Packages/HybridAskCore
  HybridAskFirebase:
    path: Packages/HybridAskFirebase
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.13.0
targets:
  AskMemoUS:
    type: application
    platform: iOS
    sources:
      - path: AskMemoUS
    entitlements:
      path: AskMemoUS/AskMemoUS.entitlements
      properties:
        com.apple.developer.devicecheck.appattest-environment: production # TestFlight/App Store; debug builds use the debug provider
    info:
      path: AskMemoUS/Info.plist
      properties:
        CFBundleDisplayName: AskMemoUS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION) # raise in settings below for each upload
        ITSAppUsesNonExemptEncryption: false # HTTPS only
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memous.hybridask
        DEVELOPMENT_TEAM: ${ASKMEMOUS_TEAM} # your Apple Team ID, from the environment (see README)
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon # Memo on night blue, MemoUS art
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: HybridAskCore
      - package: HybridAskFirebase
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseRemoteConfig
